[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-api"
version = "0.1.0"
description = "API for NBA fantasy basketball analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "fastapi[standard]>=0.115,<1.0",
    "nba_api>=1.12,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]
