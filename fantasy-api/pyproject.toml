[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-api"
version = "0.1.0"
description = "API for NBA fantasy basketball analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi[standard]>=0.115,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]
